services:
  db:
    image: postgres:17
    container_name: rejectr-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - rejectr-pgdata:/var/lib/postgresql/data

volumes:
  rejectr-pgdata: