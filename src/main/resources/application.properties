spring.application.name=rejectr
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Override DEVICE_TOKEN_SECRET in production (e.g. `openssl rand -hex 32`).
rejectr.device-token-secret=${DEVICE_TOKEN_SECRET:local-development-only-change-me}

spring.cache.type=caffeine
spring.cache.caffeine.spec=expireAfterWrite=60s